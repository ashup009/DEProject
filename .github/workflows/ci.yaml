name: CI Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  quality-assurance:
    name: Lint, Format, and Test
    runs-on: ubuntu-latest

    steps:
    # 1. Fetch the repository code
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Install and configure uv (manages Python & dependencies with caching)
    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    # 3. Pin your Python version
    - name: Set up Python
      run: uv python install 3.11

    # 4. Install dependencies exactly as defined in uv.lock
    - name: Install Dependencies
      run: uv sync --frozen

    # 5. Run Ruff to catch code errors and bad practices
    - name: Lint with Ruff
      run: uv run ruff check .

    # 6. Ensure code matches style formatting standards
    - name: Check Formatting with Ruff
      run: uv run ruff format --check .

    # 7. Execute unit tests
    - name: Run Tests with Pytest
      run: uv run pytest