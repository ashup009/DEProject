[project]
name = "deproject"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ashutosh Prakash", email = "ashutoshp2@icloud.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pyspark",
]

[project.scripts]
deproject = "deproject:main"

[project.optional-dependencies]
database = [
    "sqlalchemy>=2.0.50",
]
graph = [
    "matplotlib>=3.10.9",
]

[build-system]
requires = ["uv_build>=0.9.11,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.1.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.14",
]

[tool.ruff]
# This pulls in all settings from your separate ruff.toml file
extend = "ruff.toml"
